name: Backend CI/CD

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew clean test bootJar

      - name: Upload JAR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tikitaka-jar
          path: build/libs/*.jar

  deploy:
    name: Deploy to EC2
    needs: build

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: tikitaka-jar
          path: deploy

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/*.jar"
          target: "/tmp/tikitaka-deploy"
          strip_components: 1

      - name: Restart Spring Boot
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Deploying Tikitaka..."

            JAR_FILE=$(find /tmp/tikitaka-deploy -name "*.jar" | head -n 1)

            sudo install -m 0644 "$JAR_FILE" /opt/tikitaka/tikitaka.jar

            sudo systemctl restart tikitaka

            echo "Waiting for application..."

            for i in {1..12}; do
              if curl --fail --silent http://localhost:8080/actuator/health; then
                echo
                echo "Application is healthy."

                rm -rf /tmp/tikitaka-deploy

                echo "Deployment successful."
                exit 0
              fi

              echo "Application not ready yet... ($i/12)"
              sleep 5
            done

            echo "Application failed to become healthy."

            sudo systemctl status tikitaka --no-pager
            sudo journalctl -u tikitaka -n 50 --no-pager

            exit 1
