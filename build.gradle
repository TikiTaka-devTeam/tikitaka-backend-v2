plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tikitaka'
version = '0.0.1-SNAPSHOT'

java {	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.51.2') // AWS SDK 모듈 버전 관리
	implementation 'software.amazon.awssdk:s3' // AWS S3 파일 업로드·조회·삭제
	implementation 'org.apache.pdfbox:pdfbox:3.0.5' // PDF 검증·페이지 수 확인·썸네일 생성
	implementation 'org.springframework.boot:spring-boot-starter-actuator' // 상태 확인 및 모니터링
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA·Hibernate 데이터베이스 연동
	implementation 'org.springframework.boot:spring-boot-starter-flyway' // 데이터베이스 마이그레이션 관리
	implementation 'org.springframework.boot:spring-boot-starter-security' // 인증·인가 및 보안 필터
	implementation 'org.springframework.boot:spring-boot-starter-validation' // 요청 데이터 유효성 검증
	implementation 'org.springframework.boot:spring-boot-starter-webmvc' // Spring MVC 기반 REST API
	implementation 'org.springframework.boot:spring-boot-starter-websocket' // WebSocket 실시간 양방향 통신
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'com.solapi:sdk:1.0.3'
	implementation 'nl.martijndwars:web-push:5.1.2' // Web Push(VAPID) 전송
	implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2' // Web Push 암호화 Provider
	implementation 'org.apache.httpcomponents:httpcore:4.4.16' // Web Push 응답 타입
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	implementation 'org.flywaydb:flyway-database-postgresql' // PostgreSQL용 Flyway 지원
	compileOnly 'org.projectlombok:lombok' // 반복적인 Java 코드 자동 생성
	runtimeOnly 'org.postgresql:postgresql' // PostgreSQL JDBC 드라이버
	annotationProcessor 'org.projectlombok:lombok' // 컴파일 시 Lombok 어노테이션 처리
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test' // Actuator 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test' // JPA 영속성 계층 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test' // Flyway 마이그레이션 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test' // Security 인증·인가 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test' // 입력값 검증 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test' // MVC 컨트롤러·API 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test' // WebSocket 테스트 지원
	testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
	testImplementation 'org.testcontainers:junit-jupiter' // 테스트 컨테이너 수명주기 관리
	testImplementation 'org.testcontainers:localstack' // LocalStack S3 통합 테스트 지원
	testImplementation 'org.testcontainers:postgresql' // PostgreSQL Testcontainer 지원
	testCompileOnly 'org.projectlombok:lombok' // 테스트 코드에서 Lombok 사용
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // JUnit 테스트 플랫폼 실행
	testAnnotationProcessor 'org.projectlombok:lombok' // 테스트 컴파일 시 Lombok 처리
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}