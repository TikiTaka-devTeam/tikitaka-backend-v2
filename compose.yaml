services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: tikitaka-postgres
    environment:
      POSTGRES_DB: tikitaka
      POSTGRES_USER: tikitaka
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikitaka -d tikitaka"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: